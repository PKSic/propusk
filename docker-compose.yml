services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance_web32k_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance_web32k}
      POSTGRES_USER: ${POSTGRES_USER:-attendance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendance_user} -d ${POSTGRES_DB:-attendance_web32k}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
